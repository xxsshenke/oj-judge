spring:
  application:
    name: oj-judge
  datasource:
    url: jdbc:mysql://localhost:3308/oj_judge
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
           max-active: 16      # 最大连接数
           max-idle: 8
           min-idle: 2
           max-wait: 2s

mybatis:
  configuration:
    # 数据库下划线字段 → Java 驼峰属性（problem_id → problemId）
    map-underscore-to-camel-case: true
    # 把执行的 SQL 打到控制台，调试用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


